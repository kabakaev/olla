logging:
  level: debug
  format: text
  output: stdout

server:
  host: 127.0.0.1
  port: 40124
  read_timeout: 30s
  write_timeout: 5m
  idle_timeout: 2m
  shutdown_timeout: 10s
  request_logging: true
  request_limits:
    max_body_size: 20971520
    max_header_size: 1048576
  rate_limits:
    global_requests_per_minute: 0
    per_ip_requests_per_minute: 0
    burst_size: 100
    health_requests_per_minute: 0
    cleanup_interval: 1m
    trust_proxy_headers: false
    trusted_proxy_cidrs: []

telemetry:
  enabled: true
  service_name: olla-local-test
  service_version: dev
  otlp:
    endpoint: localhost:4317
    insecure: true
  traces:
    enabled: true
  metrics:
    enabled: true
  logs:
    enabled: true
    level: info
  payload_capture:
    enabled: true
    max_prompt_bytes: 32768
    max_response_bytes: 65536
    redact_headers:
      - authorization
      - cookie

proxy:
  profile: openai-compatible
  engine: olla
  load_balancer: round-robin
  connection_timeout: 30s
  response_timeout: 5m
  read_timeout: 5m
  stream_buffer_size: 32768

model_registry:
  type: memory
  enable_unifier: true
  tokenizer:
    type: approx
  unification:
    enabled: true
    stale_threshold: 24h
    cleanup_interval: 10m
  routing_strategy:
    type: optimistic
    options:
      fallback_behavior: compatible_only
      discovery_timeout: 5s
      discovery_refresh_on_miss: false

discovery:
  type: static
  refresh_interval: 30s
  static:
    endpoints:
      - url: http://localhost:11434
        name: local-openai-compatible
        type: openai-compatible
        priority: 100
        model_url: /v1/models
        health_check_url: /
        check_interval: 3s
        check_timeout: 2s
  model_discovery:
    enabled: true
    interval: 5m
    timeout: 30s
    concurrent_workers: 1
    retry_attempts: 1
    retry_backoff: 1s

translators:
  anthropic:
    enabled: true
    passthrough_enabled: true
    max_message_size: 104857600
    inspector:
      enabled: false
      output_dir: ./tmp/inspector
      session_header: X-Session-ID

management:
  enabled: false
