name: Release

on:
  push:
    #branches:
    #  - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  GO_VERSION: 1.25.x
  BUN_VERSION: "1.3.5"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Configure Bun
        # goreleaser's before.hooks run `make build-web`, which needs Bun.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Docker QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          # Tag push: Full release (pushes Docker + creates GitHub release)
          # Main push: Pushes Docker images but skips validation (no GitHub release without tag)
          # Manual/other: Local snapshot build only
          args: ${{ startsWith(github.ref, 'refs/tags/') && 'release --clean' || (github.ref == 'refs/heads/main' && 'release --clean --skip=validate' || 'build --snapshot --clean') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PWD: ${{ github.workspace }}
